<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#111;background:#fff}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;border-inline:1px solid #ddd}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;border-bottom:2px solid #111}
header.top h1{margin:0;font-size:20px}
header.top small{display:block;font-size:13px;color:#555}
main{flex:1;padding:12px 16px 84px;display:flex;flex-direction:column;gap:10px;min-width:0}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;height:56px;border-top:2px solid #111;background:#fff}
nav.tabs button{flex:1;min-width:0;padding:0;border:0;border-right:1px solid #111;background:#fff;font:600 12px system-ui;color:#111}
nav.tabs button:last-child{border-right:0}
nav.tabs button.active{background:#111;color:#fff;font-weight:700}
button{font-family:inherit}
.btn{min-height:48px;padding:0 14px;border:2px solid #111;border-radius:8px;background:#fff;color:#111;font:700 15px system-ui;cursor:pointer}
.btn.dark{background:#111;color:#fff}
.btn.sm{min-height:44px;font-size:14px}
.btn.full{width:100%}
.btn[disabled]{opacity:.4}
.chip{min-height:44px;padding:0 14px;border:2px solid #111;border-radius:22px;background:#fff;color:#111;font:600 14px system-ui}
.chip.on{background:#111;color:#fff}
.row{display:flex;gap:10px;min-width:0}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.grow{flex:1;min-width:0}
.card{border:2px solid #111;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card.dash{border-style:dashed}
.card.closed{background:#d9d9d9;border-color:#555;color:#444}
.card.closed .t{text-decoration:line-through}
.card.grey{background:#e5e5e5}
.t{font-size:16px;font-weight:700;overflow-wrap:anywhere}

.badge{border:1.5px solid #111;border-radius:4px;padding:2px 6px;font:700 12px system-ui;white-space:nowrap}
.badge.fill{background:#111;color:#fff}
.badge.dbl{background:#111;color:#fff;outline:2px solid #111;outline-offset:2px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:14px;font-weight:700}
input,select{width:100%;min-height:48px;border:2px solid #111;border-radius:8px;padding:0 12px;font:16px system-ui;color:#111;background:#fff;min-width:0}
input.auto{border-style:dashed}

.photo{flex:1;min-width:0;height:112px;border:2px dashed #111;border-radius:8px;background:#e5e5e5;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;font-size:13px;color:#333;overflow:hidden}
.photo img{max-width:100%;max-height:100%;object-fit:contain}

.sep{display:flex;justify-content:space-between;align-items:center;gap:8px}
.msg{border:2px solid #111;border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600;background:#e5e5e5}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}

.sign .line{height:44px;border-bottom:2px solid #111}

@media print{
 @page{size:A4 landscape;margin:12mm}
 body *{visibility:hidden}
 .print-area,.print-area *{visibility:visible}
 .print-area{position:absolute;left:0;top:0;width:100%}
 .tbl{overflow:visible}
 #app{border:0;max-width:none}
 .noprint{display:none!important}
 .printonly{display:block}
 th,td{font-size:11px}
}
#vf{position:fixed;inset:0;z-index:1000;background:#000;display:flex;flex-direction:column}
#vf[hidden]{display:none}
#vf video{flex:1;min-height:0;width:100%;object-fit:cover}
#vf p{margin:0;padding:8px 16px;color:#fff;font:14px system-ui;text-align:center}
.vfbar{display:flex;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.vfbar .btn{flex:1;min-height:56px}

body.busy #app{opacity:.55;pointer-events:none}
@media print{#netbar{display:none!important}}
</style>

<body>
<div id="app"></div>
<div id="netbar" hidden>Senza connessione: i dati potrebbero non essere aggiornati.</div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="gal" accept="image/*" hidden>
<div id="vf" hidden><video id="vfv" playsinline muted autoplay></video><p>Inquadra l'etichetta da vicino, senza riflessi</p><div class="vfbar"><button type="button" class="btn" data-a="vfClose">Annulla</button><button type="button" class="btn dark" data-a="vfSnap">Scatta</button></div></div>

<script>
'use strict';
/* ====== Dati: stanno sul server (database Cloudflare D1). Qui c'è solo una copia di lavoro. ====== */
const SKEY='scadenzario_session_v2';
const ADMIN_DEPT='Amministratore', ADMIN_NAME='Andrea Agamennone';
const EMPTY=()=>({rev:0,shop:{name:'',address:'',piva:''},urgentDays:1,soonDays:3,
  depts:{},staff:{},deptHasPw:{},durations:{},durPending:{},openings:[],arrivals:[]});
let db=EMPTY();
function loadSess(){try{return JSON.parse(localStorage.getItem(SKEY)||'null')}catch(e){return null}}
let sess=loadSess();
function saveSess(){try{if(sess)localStorage.setItem(SKEY,JSON.stringify(sess));else localStorage.removeItem(SKEY)}catch(e){}}
let deptsCache=[];
const newLogin=()=>({dept:'Gastronomia',depts:deptsCache,stage:1,ticket:'',ops:[],op:'',newName:''});

/* ====== Utilità ====== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const akey=n=>(n||'').trim().toLowerCase().replace(/\s+/g,' ');
const isAdmin=()=>!!(sess&&sess.admin);
function nowLocal(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
function todayDay(){return nowLocal().slice(0,10)}
function parseDay(s){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null}
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const eod=d=>{const x=new Date(d);x.setHours(23,59,59,999);return x};
function fD(s){const d=parseDay(s);return d?pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear():'—'}
function fDT(s){if(!s)return '—';const d=new Date(s);return isNaN(d)?'—':pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function fDay(d){return d?pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear():'—'}
function afterOpen(o){if(!o.aperto||!(+o.durata>0))return null;const d=new Date(o.aperto);if(isNaN(d))return null;d.setDate(d.getDate()+Number(o.durata));return eod(d)}
function deadline(o){const c=[];const s=parseDay(o.scad);if(s)c.push(eod(s));const a=afterOpen(o);if(a)c.push(a);return c.length?new Date(Math.min(...c)):null}
function status(o){
  if(o.stato==='chiuso')return{k:'closed',t:'CHIUSO'};
  const d=deadline(o);if(!d)return{k:'nodate',t:''};
  const left=Math.round((sod(d)-sod(new Date()))/864e5);
  if(left<0)return{k:'over',t:'SCADUTO',left};
  if(left<=db.urgentDays)return{k:'urg',t:'URGENTE',left};
  if(left<=db.soonDays)return{k:'soon',t:'IN SCADENZA',left};
  return{k:'ok',t:'',left};
}
const incomplete=o=>!o.articolo||!o.lotto||!o.scad||!o.aperto;
function missing(o){const m=[];if(!o.articolo)m.push('articolo');if(!o.lotto)m.push('lotto');if(!o.scad)m.push('scadenza');if(!o.aperto)m.push('apertura');return m}
function knownArticles(){const s=new Set();Object.keys(db.durations).forEach(k=>s.add(k));db.openings.forEach(o=>o.articolo&&s.add(akey(o.articolo)));db.arrivals.forEach(o=>o.articolo&&s.add(akey(o.articolo)));return [...s]}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* ====== Stato interfaccia ====== */
const ui={view:'loading',filter:'tutti',allDepts:false,msg:'',modal:null,form:null,sub:null,login:newLogin(),
  report:{from:'',to:'',dept:''},reportRows:[],reportLoading:false};
function setReportDefaults(){const t=new Date();const f=new Date();f.setDate(f.getDate()-7);const fm=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());ui.report.from=fm(f);ui.report.to=fm(t)}
setReportDefaults();

/* ====== Comunicazione con il server ====== */
let busy=false,pollT=null;
function setNet(ok){const n=$('#netbar');if(n)n.hidden=ok}
async function api(path,body,method){
  const h={'Content-Type':'application/json'};
  if(sess&&sess.token)h.Authorization='Bearer '+sess.token;
  let r;
  try{r=await fetch('/api'+path,{method:method||(body===undefined?'GET':'POST'),headers:h,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'})}
  catch(e){setNet(false);throw{offline:true,message:'Nessuna connessione: l\'operazione NON è stata salvata. Riprova quando torna la rete.'}}
  setNet(true);
  let j=null;try{j=await r.json()}catch(e){}
  if(r.status===401&&sess&&path.indexOf('/login')!==0){expireSession();throw{status:401,message:'Sessione scaduta: accedi di nuovo.'}}
  if(!r.ok)throw{status:r.status,message:(j&&j.error)||('Errore del server ('+r.status+')')};
  return j;
}
function expireSession(){
  sess=null;saveSess();db=EMPTY();ui.view='login';ui.sub=null;ui.form=null;ui.modal=null;
  ui.login=newLogin();ui.msg='Sessione scaduta: accedi di nuovo.';render();loadDepts();
}
async function loadDepts(){
  try{
    const r=await api('/depts');const changed=JSON.stringify(r.depts)!==JSON.stringify(deptsCache);
    deptsCache=r.depts;ui.login.depts=r.depts;
    if(ui.login.dept!==ADMIN_DEPT&&!r.depts.includes(ui.login.dept))ui.login.dept=r.depts[0]||ADMIN_DEPT;
    if(changed&&ui.view==='login'&&ui.login.stage===1)render();
  }catch(e){ui.msg=e.message;if(ui.view==='login')render()}
}
async function refresh(){
  const s=await api('/state');
  db=Object.assign(EMPTY(),s);
  db.staff=s.staff||{};db.deptHasPw=s.deptHasPw||{};
  db.depts={};(s.depts||[]).forEach(d=>{db.depts[d]=(db.staff[d]||[]).map(o=>o.name)});
  deptsCache=s.depts||deptsCache;
}
/* Una sola operazione alla volta: evita doppi salvataggi se si tocca due volte. */
async function busyRun(fn){
  if(busy)return false;
  busy=true;document.body.classList.add('busy');
  let ok=false;
  try{await fn();ok=true}catch(e){ui.msg=(e&&e.message)||'Errore imprevisto.'}
  busy=false;document.body.classList.remove('busy');
  return ok;
}
async function act(fn,okMsg,done){
  const ok=await busyRun(async()=>{await fn();try{await refresh()}catch(e){}});
  if(ok){if(okMsg)ui.msg=okMsg;if(done)done()}
  render();return ok;
}
const runR=async fn=>{await busyRun(fn);render()};
async function finishLogin(r){
  sess={token:r.token,dept:r.dept,op:r.op,admin:!!r.admin};saveSess();
  try{await refresh()}catch(e){sess=null;saveSess();throw e}
  ui.login=newLogin();ui.allDepts=false;ui.filter='tutti';ui.view='list';ui.msg='';startPoll();
}
/* Aggiornamento automatico: ogni 45 secondi chiede solo il numero di versione dei dati e riscarica se è cambiato. */
function startPoll(){if(!pollT)pollT=setInterval(pollNow,45000)}
async function pollNow(){
  if(!sess||document.hidden||busy)return;
  try{const r=await api('/rev');if(r.rev!==db.rev){await refresh();softRender()}}catch(e){}
}
function softRender(){   // non ridisegna mentre si sta scrivendo o c'è una conferma aperta
  if(ui.modal||ui.form||busy)return;
  if(ui.view!=='list'&&ui.view!=='arrivals')return;
  const a=document.activeElement;if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))return;
  render();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollNow()});
async function loadReport(){
  const r=ui.report;const q=[];if(r.from)q.push('from='+r.from);if(r.to)q.push('to='+r.to);
  ui.reportLoading=true;render();
  try{ui.reportRows=(await api('/openings'+(q.length?'?'+q.join('&'):''))).openings}catch(e){ui.msg=e.message}
  ui.reportLoading=false;render();
}
function saveSettings(msg){   // legge i valori dalle caselle: soglie e dati del negozio si salvano insieme
  const g=id=>{const e=$(id);return e?e.value:null};
  const n=(id,cur)=>{const v=g(id);return v===null?cur:Math.max(0,Math.round(Number(v)||0))};
  const body={urgentDays:n('#s-u',db.urgentDays),soonDays:n('#s-s',db.soonDays),
    shop:{name:g('#n-n')??db.shop.name,address:g('#n-a')??db.shop.address,piva:g('#n-p')??db.shop.piva}};
  return act(()=>api('/admin/settings',body),msg);
}

/* ====== Lettura etichetta ====== */
function parseLabel(text){
  const out={};const t=String(text||'').replace(/\r/g,'');
  const re=/(\d{1,2})\s*[\/\.\-]\s*(\d{1,2})\s*[\/\.\-]\s*(\d{4}|\d{2})\b/g;let m;const dates=[];
  while((m=re.exec(t))){
    let d=+m[1],mo=+m[2],y=+m[3];if(y<100)y+=2000;
    if(mo<1||mo>12||d<1||d>31||y<2020||y>2100)continue;
    const before=t.slice(Math.max(0,m.index-28),m.index);
    dates.push({iso:y+'-'+pad(mo)+'-'+pad(d),flag:/scad|entro|consumar|tmc|best|exp|da cons/i.test(before)});
  }
  if(dates.length){const f=dates.find(x=>x.flag);out.scad=(f||dates.slice().sort((a,b)=>a.iso<b.iso?1:-1)[0]).iso}
  let l=/\b(?:lotto|lot)\b\s*[:.\-nN°]*\s*([A-Z0-9][A-Z0-9\-\/]{2,})/i.exec(t)||/\bL\s*[:.\-]?\s*(\d[A-Z0-9\-\/]{2,})/.exec(t);
  if(l)out.lotto=l[1].toUpperCase();
  const low=t.toLowerCase().replace(/\s+/g,' ');let best='';
  knownArticles().forEach(a=>{if(a.length>best.length&&low.includes(a))best=a});
  if(best)out.articolo=db.openings.concat(db.arrivals).map(o=>o.articolo).find(n=>akey(n)===best)||best;
  return out;
}
let tessLoading=null;
function loadTesseract(){
  if(window.Tesseract)return Promise.resolve();
  if(tessLoading)return tessLoading;
  tessLoading=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=res;s.onerror=()=>{tessLoading=null;rej(new Error('offline'))};document.head.appendChild(s)});
  return tessLoading;
}
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>rej(new Error('img'));i.src=u})}
function scaled(img,max){const r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c}
function enhance(c){const x=c.getContext('2d');const id=x.getImageData(0,0,c.width,c.height);const p=id.data;
  for(let i=0;i<p.length;i+=4){let g=0.3*p[i]+0.59*p[i+1]+0.11*p[i+2];g=(g-128)*1.5+128;g=g<0?0:g>255?255:g;p[i]=p[i+1]=p[i+2]=g}
  x.putImageData(id,0,0);return c}
/* Mirino interno: impone la camera posteriore (l'attributo capture è solo un suggerimento e alcuni telefoni lo ignorano) */
let vfStream=null;
async function openCamera(){
  const md=navigator.mediaDevices;
  if(!md||!md.getUserMedia){$('#cam').click();return}
  const base={width:{ideal:1920},height:{ideal:1080}};
  try{vfStream=await md.getUserMedia({audio:false,video:Object.assign({facingMode:{exact:'environment'}},base)})}
  catch(e){
    try{vfStream=await md.getUserMedia({audio:false,video:Object.assign({facingMode:{ideal:'environment'}},base)})}
    catch(e2){if(ui.form){ui.form.ocr='Fotocamera non disponibile: consenti l\'accesso alla fotocamera nelle impostazioni del browser, oppure usa "Galleria".';render()}return}
  }
  const v=$('#vfv');v.srcObject=vfStream;$('#vf').hidden=false;
  try{await v.play()}catch(e){}
}
function closeCamera(){
  if(vfStream){vfStream.getTracks().forEach(t=>t.stop());vfStream=null}
  const v=$('#vfv');if(v)v.srcObject=null;const o=$('#vf');if(o)o.hidden=true;
}
function snapCamera(){
  const v=$('#vfv');if(!vfStream||!v.videoWidth)return;
  const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);closeCamera();
  c.toBlob(b=>handlePhoto(b),'image/jpeg',0.92);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)closeCamera()});
async function handlePhoto(file){
  if(!file||!ui.form)return;
  const f=ui.form;f.ocr='Lettura della foto in corso… (la prima volta può richiedere qualche secondo)';render();
  try{
    const img=await loadImg(file);
    f.foto=scaled(img,700).toDataURL('image/jpeg',0.6);f.fotoNew=true;
    const oc=enhance(scaled(img,1500));
    await loadTesseract();
    const r=await Tesseract.recognize(oc,'ita');
    const p=parseLabel(r.data.text);f.auto=f.auto||{};let n=0;
    ['articolo','lotto','scad'].forEach(k=>{if(p[k]){f[k]=p[k];f.auto[k]=true;n++}});
    if(p.articolo&&f.kind==='open'){applyDuration(f);}
    f.ocr=n?('Letti '+n+' campi dalla foto: controlla quelli tratteggiati e correggi se serve.'):'Non sono riuscito a leggere i dati: compila a mano.';
  }catch(e){
    f.ocr=(e&&e.message==='offline')?'Lettura automatica non disponibile (connessione assente): compila a mano.':'Lettura non riuscita: compila a mano.';
  }
  render();
}

/* ====== Logica ====== */
function pendN(){return Object.keys(db.durPending).filter(x=>db.durations[x]!=null).length}
function durLocked(f){const k=akey(f.articolo);return !isAdmin()&&k&&db.durations[k]!=null}
function applyDuration(f){const k=akey(f.articolo);if(k&&db.durations[k]!=null)f.durata=String(db.durations[k])}
function dupsOf(f){
  const k=akey(f.articolo);if(!k||f.kind!=='open')return[];
  return db.openings.filter(o=>o.stato==='aperto'&&o.dept===f.dept&&akey(o.articolo)===k&&o.id!==f.id);
}
function newForm(kind,pre){
  return Object.assign({kind,id:null,articolo:'',lotto:'',scad:'',aperto:nowLocal(),durata:'',dept:isAdmin()?(Object.keys(db.depts)[0]||'Gastronomia'):sess.dept,foto:'',fotoNew:false,auto:{},ocr:''},pre||{});
}
async function saveForm(){
  const f=ui.form;if(!f)return;
  if(!f.articolo.trim()&&!f.lotto.trim()&&!f.scad){ui.msg='Inserisci almeno articolo, lotto o scadenza.';render();return}
  if(f.kind==='open'){
    const body={id:f.id||undefined,dept:f.dept,articolo:f.articolo,lotto:f.lotto,scad:f.scad,aperto:f.aperto,durata:f.durata,fromArrival:f.fromArrival||undefined};
    if(f.fotoNew&&f.foto)body.foto=f.foto;
    const rec={articolo:f.articolo.trim(),lotto:f.lotto.trim(),scad:f.scad,aperto:f.aperto};
    await act(()=>api('/openings',body),'Apertura salvata'+(incomplete(rec)?' (da completare: '+missing(rec).join(', ')+')':'')+'.',()=>{ui.form=null;ui.view='list'});
  }else{
    const body={id:f.id||undefined,dept:f.dept,articolo:f.articolo,lotto:f.lotto,scad:f.scad};
    await act(()=>api('/arrivals',body),'Arrivo salvato.',()=>{ui.form=null;ui.view='arrivals'});
  }
}

function card(o){
  const st=status(o);const inc=incomplete(o);
  if(o.stato==='chiuso'){
    return `<div class="card closed"><div class="sep"><span class="t">${esc(o.articolo||'(senza nome)')}</span><span class="badge">CHIUSO</span></div>
    <span class="s">${o.lotto?'Lotto '+esc(o.lotto)+' · ':''}chiuso ${fDT(o.chiusoIl)} · ${esc(o.motivo)}${o.opChiuso?' · '+esc(o.opChiuso):''}</span>
    ${ui.allDepts||isAdmin()?`<span class="s">${esc(o.dept)}</span>`:''}</div>`;
  }
  const bcls=st.k==='over'?'dbl':st.k==='urg'?'fill':'';
  const dl=deadline(o);
  return `<div class="card ${inc?'dash':''}">
   <div class="sep"><span class="t">${esc(o.articolo||'(senza nome)')}</span>${st.t?`<span class="badge ${bcls}">${st.t}</span>`:''}</div>
   <span class="s">${o.lotto?'Lotto '+esc(o.lotto)+' · ':''}aperto ${fDT(o.aperto)}${isAdmin()||ui.allDepts?' · '+esc(o.dept):''}</span>
   <span class="s">${dl?'Scade '+fDay(dl)+(o.durata>0?' (durata '+o.durata+' gg)':''):'Scadenza non calcolabile'}</span>
   ${inc?`<span class="s"><b>Mancano:</b> ${missing(o).join(', ')}</span>`:''}
   <div class="row" style="align-items:center;justify-content:space-between;flex-wrap:wrap">
    <label class="chk"><input type="checkbox" data-a-change="close" data-id="${o.id}"> Segna come chiuso</label>
    <button type="button" class="btn sm" data-a="edit" data-id="${o.id}">${inc?'Completa':'Modifica'}</button>
   </div></div>`;
}
function vList(){
  const all=isAdmin()||ui.allDepts;
  let items=db.openings.filter(o=>all||o.dept===sess.dept);
  const open=items.filter(o=>o.stato==='aperto');
  const urgent=open.filter(o=>['urg','over'].includes(status(o).k));
  const soon=open.filter(o=>status(o).k==='soon');
  const incs=open.filter(incomplete);
  const dayAgo=new Date(Date.now()-864e5);
  const closed=items.filter(o=>o.stato==='chiuso').sort((a,b)=>(b.chiusoIl||'')<(a.chiusoIl||'')?-1:1);
  const rank=o=>{const d=deadline(o);return d?d.getTime():9e15};
  const by=a=>a.slice().sort((x,y)=>rank(x)-rank(y));
  let body='';
  const F=ui.filter;
  if(F==='chiusi'){
    body=closed.length?closed.slice(0,60).map(card).join(''):'<p class="hint">Nessuna apertura chiusa.</p>';
  }else if(F==='urgenti'){
    body=urgent.length?by(urgent).map(card).join(''):'<p class="hint">Nessun prodotto urgente.</p>';
  }else{
    const toc=by(incs);const ok=by(open.filter(o=>!incomplete(o)));
    const recent=closed.filter(o=>o.chiusoIl&&new Date(o.chiusoIl)>=dayAgo);
    const np=Object.keys(db.durPending).filter(x=>db.durations[x]!=null).length;
    body=(isAdmin()&&np?`<button type="button" class="card dash" style="text-align:left;font:inherit;cursor:pointer" data-a="toDurations"><strong style="font-size:14px">${np} durat${np===1?'a':'e'} da validare ›</strong><span class="s">Imparate da un operatore: controllale nelle impostazioni.</span></button>`:'')+(toc.length?`<div class="sec">DA COMPLETARE (${toc.length})</div>${toc.map(card).join('')}`:'')+
      `<div class="sec">APERTI (${ok.length})</div>${ok.length?ok.map(card).join(''):'<p class="hint">Nessun prodotto aperto.</p>'}`+
      (recent.length?`<div class="sec">CHIUSI NELLE ULTIME 24 ORE (${recent.length})</div>${recent.map(card).join('')}`:'');
  }
  return topbar('Scadenzario',who(),'<button type="button" class="btn sm" data-a="logout">Esci</button>')+
  `<main>${msgBox()}
   <div class="card grey"><strong style="font-size:14px">Avvisi</strong><span style="font-size:14px">${urgent.length} urgenti · ${soon.length} in scadenza · ${incs.length} da completare</span></div>
   <div class="row" style="flex-wrap:wrap">${[['tutti','Tutti'],['urgenti','Urgenti'],['chiusi','Chiusi']].map(x=>`<button type="button" class="chip ${F===x[0]?'on':''}" data-a="filter" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
   ${isAdmin()?'':`<label class="chk"><input type="checkbox" data-a-change="allDepts" ${ui.allDepts?'checked':''}> Mostra anche gli altri reparti</label>`}
   ${body}
   <button type="button" class="btn dark full" style="min-height:52px" data-a="new">+ Nuova apertura</button></main>`+tabs('list');
}

function derived(){
  const f=ui.form;
  const dl=deadline({scad:f.scad,aperto:f.aperto,durata:f.durata===''?0:Number(f.durata)});
  const d=dupsOf(f);
  const k=akey(f.articolo);
  return {
    dl:f.kind==='open'?`<span style="font-size:13px;color:#333">Scade (il primo tra scadenza confezione e durata dopo apertura)</span><strong style="font-size:18px">${dl?fDay(dl):'—'}</strong>`:'',
    dup:d.map(o=>`<div class="card"><strong style="font-size:14px">C'è già ${esc(o.articolo)} aperto${o.lotto?' (lotto '+esc(o.lotto)+')':''}</strong><span class="s">Salvando, quello passa in chiusura come "sostituito da nuova apertura".</span></div>`).join(''),
    dur:k&&db.durations[k]!=null&&db.durPending[k]?(isAdmin()?'Durata '+db.durations[k]+' gg, DA VALIDARE: se è giusta salvando la validi, altrimenti correggila':'Durata '+db.durations[k]+' gg, in attesa di validazione dell\'amministratore'):k&&db.durations[k]!=null?(isAdmin()?'Durata conosciuta: '+db.durations[k]+' gg (puoi cambiarla come admin)':'Articolo già noto: durata '+db.durations[k]+' gg, modificabile solo dall\'amministratore'):(k?'Articolo nuovo: la durata che inserisci verrà ricordata':''),
    locked:durLocked(f)
  };
}

function reportRows(){
  const r=ui.report;const from=r.from?sod(parseDay(r.from)):null;const to=r.to?eod(parseDay(r.to)):null;
  return (ui.reportRows||[]).filter(o=>{
    if(r.dept&&o.dept!==r.dept)return false;
    if(!(isAdmin()||ui.allDepts||o.dept===sess.dept))return false;
    const a=o.aperto?new Date(o.aperto):null;const c=o.chiusoIl?new Date(o.chiusoIl):null;
    if(to&&a&&a>to)return false;
    if(from&&o.stato==='chiuso'&&c&&c<from)return false;
    return true;
  }).sort((a,b)=>(b.aperto||'')<(a.aperto||'')?-1:1);
}

}
function vDurations(){
  const ks=Object.keys(db.durations).sort((a,b)=>(db.durPending[b]?1:0)-(db.durPending[a]?1:0)||(a<b?-1:1));
  return topbar('Durate degli articoli',null,'<button type="button" class="btn sm" data-a="sub" data-v="">Indietro</button>')+`<main>${msgBox()}
  <p class="hint">Giorni di validità dopo l'apertura. Si imparano dalla prima apertura di ogni articolo; qui li correggi solo tu.</p>
  ${ks.map(k=>`<div class="row" style="align-items:flex-end"><div class="f grow"><label for="d-${esc(k)}">${esc(k)}${db.durPending[k]?' <strong>· DA VALIDARE</strong>':''}</label><input id="d-${esc(k)}" type="number" inputmode="numeric" min="1" data-dur="${esc(k)}" value="${db.durations[k]}"></div>${db.durPending[k]?`<button type="button" class="btn sm dark" data-a="valDur" data-k="${esc(k)}">Valida</button>`:''}<button type="button" class="btn sm" data-a="delDur" data-k="${esc(k)}" aria-label="Elimina ${esc(k)}">Elimina</button></div>`).join('')||'<p class="hint">Nessun articolo ancora.</p>'}
  <div class="card"><strong>Aggiungi articolo</strong>
   <div class="f"><label for="d-new-n">Articolo</label><input id="d-new-n" type="text"></div>
   <div class="f"><label for="d-new-d">Giorni</label><input id="d-new-d" type="number" inputmode="numeric" min="1"></div>
   <button type="button" class="btn dark sm" data-a="addDur">Aggiungi</button></div></main>`;
}
function vStaff(){
  return topbar('Reparti e operatori',null,'<button type="button" class="btn sm" data-a="sub" data-v="">Indietro</button>')+`<main>${msgBox()}
  <p class="hint">Ogni reparto ha una password condivisa per entrare; ogni operatore sceglie al primo accesso un PIN personale. Se qualcuno dimentica il PIN, lo azzeri da qui.</p>
  ${Object.keys(db.depts).map(d=>`<div class="card"><div class="sep"><strong>${esc(d)}</strong><span class="tag">${db.deptHasPw[d]?'PASSWORD IMPOSTATA':'SENZA PASSWORD'}</span></div>
   <div class="row"><input type="password" id="pw-${esc(d)}" placeholder="${db.deptHasPw[d]?'Nuova password (min. 6)':'Imposta password (min. 6)'}" autocomplete="new-password" aria-label="Password del reparto ${esc(d)}"><button type="button" class="btn sm" data-a="setDeptPw" data-d="${esc(d)}">Salva</button></div>
   ${(db.staff[d]||[]).map(o=>`<div class="sep"><span>${esc(o.name)} <span class="s">· ${o.hasPin?'PIN impostato':'PIN non ancora scelto'}</span></span><span class="row"><button type="button" class="btn sm" data-a="resetPin" data-id="${esc(o.id)}" data-n="${esc(o.name)}" ${o.hasPin?'':'disabled'}>Azzera PIN</button><button type="button" class="btn sm" data-a="delOp" data-id="${esc(o.id)}" data-n="${esc(o.name)}">Rimuovi</button></span></div>`).join('')||'<span class="s">Nessun operatore</span>'}
   <div class="row"><input type="text" id="o-${esc(d)}" placeholder="Nuovo operatore" aria-label="Nuovo operatore ${esc(d)}"><button type="button" class="btn sm" data-a="addOp" data-d="${esc(d)}">Aggiungi</button></div></div>`).join('')}
  <div class="card"><strong>Nuovo reparto</strong>
   <input type="text" id="o-newdept" placeholder="Nome reparto" aria-label="Nome nuovo reparto">
   <input type="password" id="o-newdept-pw" placeholder="Password (min. 6)" autocomplete="new-password" aria-label="Password del nuovo reparto">
   <button type="button" class="btn sm" data-a="addDept">Aggiungi</button></div></main>`;
}
function vModal(){
  const m=ui.modal;if(!m)return '';
  return `<div class="overlay"><div class="modal" role="dialog" aria-modal="true"><strong style="font-size:17px">${esc(m.title)}</strong><p style="margin:0;font-size:14px">${esc(m.text)}</p>
  <div class="row"><button type="button" class="btn grow" data-a="modalNo">Annulla</button><button type="button" class="btn dark grow" data-a="modalYes">${esc(m.yes)}</button></div></div></div>`;
}

function render(){
  let h='';
  if(ui.view==='loading')h='<main style="justify-content:center"><p class="hint" style="text-align:center">Caricamento…</p></main>';
  else if(ui.view==='offline')h=`<main style="justify-content:center;gap:16px"><h1 style="margin:0;font-size:28px">Scadenzario</h1>${msgBox()}<button type="button" class="btn dark full" data-a="retry">Riprova</button><button type="button" class="btn full" data-a="logout">Esci</button></main>`;
  else if(!sess||ui.view==='login')h=vLogin();
  else if(ui.view==='new'||ui.view==='newArrival')h=vForm();
  else if(ui.view==='arrivals')h=vArrivals();
  else if(ui.view==='report')h=vReport();
  else if(ui.view==='settings'){h=ui.sub==='durations'?vDurations():ui.sub==='staff'?vStaff():vSettings()}
  else h=vList();
  $('#app').innerHTML=h+vModal();
  if(ui.view==='new'||ui.view==='newArrival')refreshForm();
}

/* ====== Azioni ====== */
function go(v){ui.view=v;ui.sub=null;ui.form=null;render();window.scrollTo(0,0);if(v==='report')loadReport()}
const A={
  go:t=>go(t.dataset.v),
  filter:t=>{ui.filter=t.dataset.v;render()},
  sub:t=>{ui.sub=t.dataset.v||null;render()},
  loginNext:()=>runR(async()=>{
    const l=ui.login;const pwd=($('#l-pwd')||{}).value||'';
    if(!pwd)throw{message:'Inserisci la password.'};
    if(l.dept===ADMIN_DEPT){await finishLogin(await api('/login/admin',{password:pwd}));return}
    const r=await api('/login/dept',{dept:l.dept,password:pwd});
    l.ticket=r.ticket;l.ops=r.operators;l.op=r.operators.length?r.operators[0].id:'__new__';l.newName='';l.stage=2;
  }),
  loginGo:()=>runR(async()=>{
    const l=ui.login;const isNew=l.op==='__new__'||!l.ops.length;
    const body={ticket:l.ticket,pin:($('#l-pin')||{}).value||'',pin2:($('#l-pin2')||{}).value||'',opId:isNew?'__new__':l.op};
    if(isNew){body.newName=(l.newName||'').trim();if(!body.newName)throw{message:'Scrivi il tuo nome.'}}
    try{await finishLogin(await api('/login/operator',body))}
    catch(e){if(e&&/^Tempo scaduto/.test(e.message||''))l.stage=1;throw e}
  }),
  loginBack:()=>{ui.login.stage=1;ui.login.ticket='';ui.msg='';render()},
  retry:()=>boot(),
  logout:()=>runR(async()=>{
    const tok=sess&&sess.token;sess=null;saveSess();
    try{await fetch('/api/logout',{method:'POST',headers:{Authorization:'Bearer '+tok}})}catch(e){}
    db=EMPTY();ui.view='login';ui.sub=null;ui.form=null;ui.login=newLogin();loadDepts();
  }),
  new:()=>{ui.form=newForm('open');ui.view='new';render();window.scrollTo(0,0)},
  newArrival:()=>{ui.form=newForm('arrival');ui.view='newArrival';render();window.scrollTo(0,0)},
  edit:t=>{const o=db.openings.find(x=>x.id==t.dataset.id);if(!o)return;
    ui.form=Object.assign(newForm('open'),o,{durata:o.durata===''||o.durata==null?'':String(o.durata),foto:'',fotoNew:false,auto:{}});
    ui.view='new';render();window.scrollTo(0,0);
    if(o.hasFoto){const id=o.id;api('/photos/'+encodeURIComponent(id)).then(r=>{
      if(r.data&&ui.form&&ui.form.id===id&&!ui.form.fotoNew){ui.form.foto=r.data;const ph=document.querySelector('.photo');if(ph)ph.innerHTML='<img src="'+r.data+'" alt="Foto dell\'etichetta">'}
    }).catch(()=>{})}},
  editArrival:t=>{const o=db.arrivals.find(x=>x.id==t.dataset.id);if(!o)return;ui.form=Object.assign(newForm('arrival'),o,{auto:{}});ui.view='newArrival';render()},
  openFromArrival:t=>{const a=db.arrivals.find(x=>x.id==t.dataset.id);if(!a)return;
    ui.form=newForm('open',{articolo:a.articolo,lotto:a.lotto,scad:a.scad,dept:a.dept,fromArrival:a.id});applyDuration(ui.form);ui.view='new';render();window.scrollTo(0,0)},
  removeArrival:t=>{ui.modal={title:'Rimuovere dagli arrivi?',text:'L\'articolo esce dalla giacenza (es. scartato o finito).',yes:'Rimuovi',fn:()=>act(()=>api('/arrivals/'+encodeURIComponent(t.dataset.id)+'/remove',{}),'Arrivo rimosso.')};render()},
  cancelForm:()=>{ui.form=null;go(ui.view==='newArrival'?'arrivals':'list')},
  saveForm:()=>{
    const f=ui.form;if(!f)return;
    const d=dupsOf(f);
    if(d.length&&f.kind==='open'){ui.modal={title:'Prodotto già aperto',text:'C\'è già "'+d[0].articolo+'" aperto. Salvando, quello passa in chiusura come "sostituito da nuova apertura". Continuare?',yes:'Salva e chiudi il vecchio',fn:saveForm};render();return}
    saveForm();
  },
  cam:()=>openCamera(),
  vfClose:()=>closeCamera(),
  vfSnap:()=>snapCamera(),
  gal:()=>$('#gal').click(),
  modalNo:()=>{ui.modal=null;render()},
  modalYes:()=>{const m=ui.modal;ui.modal=null;if(m&&m.fn)m.fn();render()},
  print:()=>window.print(),
  saveShop:()=>saveSettings('Dati del negozio salvati.'),
  exportJson:()=>runR(async()=>{const j=await api('/admin/export');download('scadenzario-backup-'+todayDay()+'.json',JSON.stringify(j,null,1),'application/json')}),
  exportCsv:()=>runR(async()=>{
    const j=await api('/openings?all=1');
    const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
    const rows=[['Reparto','Articolo','Lotto','Scadenza confezione','Aperto il','Durata gg','Scadenza dopo apertura','Operatore apertura','Stato','Chiuso il','Motivo','Operatore chiusura']];
    j.openings.forEach(o=>rows.push([o.dept,o.articolo,o.lotto,o.scad,o.aperto,o.durata,afterOpen(o)?fDay(afterOpen(o)):'',o.opAperto,o.stato,o.chiusoIl||'',o.motivo||'',o.opChiuso||'']));
    download('registro-aperture-'+todayDay()+'.csv','﻿'+rows.map(r=>r.map(q).join(';')).join('\n'),'text/csv');
  }),
  delDur:t=>act(()=>api('/admin/durations/delete',{k:t.dataset.k}),'Durata eliminata.'),
  valDur:t=>act(()=>api('/admin/durations/validate',{k:t.dataset.k}),'Durata validata: '+t.dataset.k+'.'),
  toDurations:()=>{ui.view='settings';ui.sub='durations';ui.form=null;render();window.scrollTo(0,0)},
  addDur:()=>{const n=akey($('#d-new-n').value);const d=Number($('#d-new-d').value);if(!n||!(d>0)){ui.msg='Inserisci articolo e giorni.';render();return}act(()=>api('/admin/durations',{k:n,days:d}),'Articolo aggiunto.')},
  addOp:t=>{const d=t.dataset.d;const v=$('#o-'+CSS.escape(d)).value.trim();if(!v)return;act(()=>api('/admin/operator',{dept:d,name:v}),'Operatore aggiunto.')},
  delOp:t=>{ui.modal={title:'Rimuovere l\'operatore?',text:t.dataset.n+' non comparirà più nell\'elenco del login e verrà scollegato. Le sue aperture restano nel registro.',yes:'Rimuovi',fn:()=>act(()=>api('/admin/operator/delete',{id:t.dataset.id}),'Operatore rimosso.')};render()},
  resetPin:t=>{ui.modal={title:'Azzerare il PIN?',text:t.dataset.n+' verrà scollegato e dovrà scegliere un nuovo PIN al prossimo accesso.',yes:'Azzera PIN',fn:()=>act(()=>api('/admin/operator/reset-pin',{id:t.dataset.id}),'PIN di '+t.dataset.n+' azzerato.')};render()},
  setDeptPw:t=>{const d=t.dataset.d;const v=$('#pw-'+CSS.escape(d)).value;if(v.length<6){ui.msg='La password deve avere almeno 6 caratteri.';render();return}act(()=>api('/admin/dept/password',{name:d,password:v}),'Password del reparto '+d+' salvata.')},
  addDept:()=>{const v=$('#o-newdept').value.trim();const pw=$('#o-newdept-pw').value;if(!v){ui.msg='Scrivi il nome del reparto.';render();return}if(pw.length<6){ui.msg='La password deve avere almeno 6 caratteri.';render();return}act(()=>api('/admin/dept',{name:v,password:pw}),'Reparto aggiunto.')}
};
const AC={
  loginDept:t=>{ui.login.dept=t.value;ui.login.op='';render()},
  loginOp:t=>{ui.login.op=t.value;render()},
  close:t=>{const o=db.openings.find(x=>x.id==t.dataset.id);if(!o||!t.checked)return;
    ui.modal={title:'Chiudere il prodotto?',text:'"'+(o.articolo||'prodotto')+'"'+(o.lotto?' (lotto '+o.lotto+')':'')+' passa in chiusura come "terminato al banco". Dopo la conferma non si può più riaprire.',yes:'Sì, chiudi',
      fn:()=>act(()=>api('/openings/'+encodeURIComponent(o.id)+'/close',{}),'Chiuso: '+(o.articolo||'prodotto')+'.')};render()},
  allDepts:t=>{ui.allDepts=t.checked;render()}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t||t.disabled)return;
  const f=A[t.dataset.a];if(f)f(t,e);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='cam'||t.id==='gal'){const file=t.files&&t.files[0];t.value='';handlePhoto(file);return}
  const c=t.dataset&&t.dataset.aChange;if(c&&AC[c]){AC[c](t);return}
  if(t.dataset.f&&ui.form){
    const k=t.dataset.f;ui.form[k]=t.value;if(ui.form.auto)delete ui.form.auto[k];
    if(k==='articolo'){applyDuration(ui.form)}
    if(k==='dept'){/* ricalcola duplicati */}
    refreshForm();
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f&&ui.form){ui.form[t.dataset.f]=t.value;if(ui.form.auto)delete ui.form.auto[t.dataset.f];if(t.dataset.f!=='articolo')refreshForm()}
  else if(t.dataset.aInput==='loginNew')ui.login.newName=t.value;
  else if(t.dataset.r){ui.report[t.dataset.r]=t.value;if(t.tagName==='SELECT')render()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.r){ui.report[t.dataset.r]=t.value;if(t.dataset.r==='dept')render();else loadReport()}
  else if(t.dataset.s){saveSettings('Avvisi salvati.')}
  else if(t.dataset.dur){const v=Number(t.value);if(v>0)act(()=>api('/admin/durations',{k:t.dataset.dur,days:v}),'Durata aggiornata.')}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='l-pwd')A.loginNext();
  else if(e.target.id==='l-pin'||e.target.id==='l-pin2')A.loginGo();
});
async function boot(){
  if(sess){
    ui.view='loading';ui.msg='';render();
    try{await refresh();ui.view='list';startPoll()}
    catch(e){if(sess){ui.view='offline';ui.msg=(e&&e.message)||'Impossibile caricare i dati.'}}
    render();
  }else{ui.view='login';render();loadDepts()}
}
boot();
</script>
</body>
</html>

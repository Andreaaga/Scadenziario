<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scadenzario</title>
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#111;background:#fff}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;border-inline:1px solid #ddd}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;border-bottom:2px solid #111}
header.top h1{margin:0;font-size:20px}
header.top small{display:block;font-size:13px;color:#555}
main{flex:1;padding:12px 16px 84px;display:flex;flex-direction:column;gap:10px;min-width:0}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;height:56px;border-top:2px solid #111;background:#fff}
nav.tabs button{flex:1;min-width:0;padding:0;border:0;border-right:1px solid #111;background:#fff;font:600 12px system-ui;color:#111}
nav.tabs button:last-child{border-right:0}
nav.tabs button.active{background:#111;color:#fff;font-weight:700}
button{font-family:inherit}
.btn{min-height:48px;padding:0 14px;border:2px solid #111;border-radius:8px;background:#fff;color:#111;font:700 15px system-ui;cursor:pointer}
.btn.dark{background:#111;color:#fff}
.btn.sm{min-height:44px;font-size:14px}
.btn.full{width:100%}
.btn[disabled]{opacity:.4}
.chip{min-height:44px;padding:0 14px;border:2px solid #111;border-radius:22px;background:#fff;color:#111;font:600 14px system-ui}
.chip.on{background:#111;color:#fff}
.row{display:flex;gap:10px;min-width:0}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.grow{flex:1;min-width:0}
.card{border:2px solid #111;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card.dash{border-style:dashed}
.card.closed{background:#d9d9d9;border-color:#555;color:#444}
.card.closed .t{text-decoration:line-through}
.card.grey{background:#e5e5e5}
.t{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.s{font-size:13px;color:#333;overflow-wrap:anywhere}
.sec{font-size:12px;font-weight:700;color:#555;letter-spacing:1px;margin-top:4px}
.badge{border:1.5px solid #111;border-radius:4px;padding:2px 6px;font:700 12px system-ui;white-space:nowrap}
.badge.fill{background:#111;color:#fff}
.badge.dbl{background:#111;color:#fff;outline:2px solid #111;outline-offset:2px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:14px;font-weight:700}
input,select{width:100%;min-height:48px;border:2px solid #111;border-radius:8px;padding:0 12px;font:16px system-ui;color:#111;background:#fff;min-width:0}
input.auto{border-style:dashed}
input[readonly]{background:#e5e5e5}
input[type=checkbox]{width:22px;height:22px;min-height:0;margin:0;flex:none}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;font-weight:600}
.hint{font-size:13px;color:#555;margin:0}
.warn{font-size:12px;font-weight:700}
.photo{flex:1;min-width:0;height:112px;border:2px dashed #111;border-radius:8px;background:#e5e5e5;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;font-size:13px;color:#333;overflow:hidden}
.photo img{max-width:100%;max-height:100%;object-fit:contain}
.w130{width:130px;flex:none}
.tag{border:1.5px solid #111;border-radius:4px;padding:2px 6px;font:700 11px system-ui;background:#111;color:#fff}
.sep{display:flex;justify-content:space-between;align-items:center;gap:8px}
.msg{border:2px solid #111;border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600;background:#e5e5e5}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal{background:#fff;border:2px solid #111;border-radius:10px;padding:16px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1.5px solid #111;padding:6px 8px;text-align:left;vertical-align:top}
th{background:#e5e5e5}
tr.cl td{background:#d9d9d9}
.print-area .head{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.sign{margin-top:24px;display:flex;justify-content:flex-end}
.sign div{width:300px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.sign .line{height:44px;border-bottom:2px solid #111}
.printonly{display:none}
@media print{
 @page{size:A4 landscape;margin:12mm}
 body *{visibility:hidden}
 .print-area,.print-area *{visibility:visible}
 .print-area{position:absolute;left:0;top:0;width:100%}
 .tbl{overflow:visible}
 #app{border:0;max-width:none}
 .noprint{display:none!important}
 .printonly{display:block}
 th,td{font-size:11px}
}
#vf{position:fixed;inset:0;z-index:1000;background:#000;display:flex;flex-direction:column}
#vf[hidden]{display:none}
#vf video{flex:1;min-height:0;width:100%;object-fit:cover}
#vf p{margin:0;padding:8px 16px;color:#fff;font:14px system-ui;text-align:center}
.vfbar{display:flex;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.vfbar .btn{flex:1;min-height:56px}
#netbar{position:fixed;top:0;left:0;right:0;z-index:900;background:#111;color:#fff;font:700 13px system-ui;text-align:center;padding:6px 8px}
body.busy #app{opacity:.55;pointer-events:none}
@media print{#netbar{display:none!important}}
</style>
<style id="tema">
/* Scadenzario: stesso stile di HACCP Express (iOS: sfondo grigio chiaro, schede bianche, blu di sistema, tema scuro automatico).
   Si carica DOPO lo stile interno di index.html e lo sostituisce. La stampa del report resta in bianco e nero. */
:root{
 --bg:242 242 247;--card:255 255 255;--card2:249 249 251;
 --label:0 0 0;--label2:99 99 105;--label3:142 142 147;
 --sep:60 60 67;--fill:120 120 128;
 --blue:0 122 255;--green:52 199 89;--red:255 59 48;--orange:255 149 0;
 --ink2:rgb(var(--label2));
 --r:12px;--r2:16px;
 color-scheme:light dark;
}
@media screen and (prefers-color-scheme:dark){
 :root{
  --bg:0 0 0;--card:28 28 30;--card2:38 38 41;
  --label:255 255 255;--label2:174 174 178;--label3:142 142 147;
  --sep:84 84 88;--fill:120 120 128;
  --blue:10 132 255;--green:48 209 88;--red:255 69 58;--orange:255 159 10;
 }
}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{color:rgb(var(--label));background:rgb(var(--bg));font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body,button,input,select,.btn,.chip,.badge,.tag,nav.tabs button,#vf p,#netbar{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{background:rgb(var(--bg));border-inline:0;max-width:512px}

/* Intestazione: titolo grande, barra traslucida */
header.top{position:sticky;top:0;z-index:5;align-items:flex-end;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:0;
 background:rgb(var(--bg) / .85);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
header.top h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
header.top small{margin-top:2px;font-size:15px;color:rgb(var(--label2))}
header.top .btn{min-height:44px;padding:0 4px;border:0;background:none;color:rgb(var(--blue));font-size:17px;font-weight:400}
main{padding:8px 16px calc(104px + env(safe-area-inset-bottom));gap:12px}

/* Barra in basso con icone */
nav.tabs{height:auto;max-width:512px;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid rgb(var(--sep) / .2);
 background:rgb(var(--bg) / .85);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);z-index:20}
nav.tabs button{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding-top:6px;border:0;background:none;
 color:rgb(var(--label3));font-size:11px;font-weight:600}
nav.tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.active{background:none;color:rgb(var(--blue));font-weight:600}
nav.tabs button.active svg{stroke-width:2.4}

/* Pulsanti: primario blu pieno, secondario blu tenue */
.btn{min-height:52px;padding:0 20px;border:0;border-radius:var(--r2);background:rgb(var(--blue) / .1);color:rgb(var(--blue));font-size:17px;font-weight:600;cursor:pointer}
.btn.sm{min-height:44px;padding:0 14px;border-radius:var(--r);font-size:15px}
.btn.dark{background:rgb(var(--blue));color:#fff}
.btn[disabled]{opacity:1;background:rgb(var(--fill) / .3);color:rgb(var(--label3))}
.chip{min-height:40px;padding:0 16px;border:0;border-radius:999px;background:rgb(var(--fill) / .15);color:rgb(var(--label));font-size:15px;font-weight:600}
.chip.on{background:rgb(var(--blue));color:#fff}
.btn,.chip,nav.tabs button{transition:transform .12s ease,opacity .12s ease,background-color .16s}
.btn:active,.chip:active,nav.tabs button:active{transform:scale(.97);opacity:.85}

/* Schede */
.card{background:rgb(var(--card));border:0;border-radius:var(--r2);padding:12px 16px;box-shadow:0 1px 2px rgb(0 0 0 / .04);color:rgb(var(--label))}
.card.dash{border:0;box-shadow:inset 0 0 0 1.5px rgb(var(--orange) / .55)}
.card.grey{background:rgb(var(--blue) / .1);box-shadow:none}
.card.closed{background:rgb(var(--card2));color:rgb(var(--label2));box-shadow:none}
.t{font-size:17px;font-weight:600}
.s{font-size:14px;color:rgb(var(--label2))}
.sec{margin-top:8px;padding:0 4px;font-size:13px;font-weight:500;letter-spacing:.04em;color:rgb(var(--label2))}
.hint{font-size:13px;color:rgb(var(--label2))}
.warn{font-size:13px;font-weight:600;color:rgb(var(--blue))}

/* Stati (testo sempre scritto): In scadenza arancio, Urgente rosso tenue, Scaduto rosso pieno */
.badge{display:inline-flex;align-items:center;border:0;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:rgb(var(--orange) / .15);color:rgb(var(--orange))}
.badge.fill{background:rgb(var(--red) / .15);color:rgb(var(--red))}
.badge.dbl{background:rgb(var(--red));color:#fff;outline:0}
.card.closed .badge{background:rgb(var(--fill) / .2);color:rgb(var(--label2))}
.tag{border:0;border-radius:6px;background:rgb(var(--blue) / .15);color:rgb(var(--blue));font-weight:600}

/* Campi */
.f{gap:6px}
.f label{padding:0 4px;font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:rgb(var(--label2))}
input,select{min-height:52px;border:0;border-radius:var(--r);padding:0 16px;font-size:17px;background:rgb(var(--card));color:rgb(var(--label));
 box-shadow:inset 0 0 0 1px rgb(var(--sep) / .15);transition:box-shadow .12s}
input:focus,select:focus{outline:none;box-shadow:inset 0 0 0 2px rgb(var(--blue))}
input.auto{border:0;background:rgb(var(--blue) / .08);box-shadow:inset 0 0 0 1.5px rgb(var(--blue) / .6)}
input[readonly]{background:rgb(var(--fill) / .12);color:rgb(var(--label2))}
input[type=date],input[type=datetime-local]{padding:0 10px}
input[type=checkbox]{box-shadow:none;accent-color:rgb(var(--blue))}
.chk{font-size:15px;font-weight:500}
.photo{border:0;border-radius:var(--r);background:rgb(var(--card));box-shadow:inset 0 0 0 1.5px rgb(var(--sep) / .2);color:rgb(var(--label2))}

/* Messaggi e finestre */
.msg{border:0;border-radius:var(--r);background:rgb(var(--blue) / .12);color:rgb(var(--label))}
.overlay{background:rgb(0 0 0 / .4)}
.modal{border:0;border-radius:var(--r2);background:rgb(var(--card));color:rgb(var(--label));box-shadow:0 10px 40px rgb(0 0 0 / .18)}
#netbar{background:rgb(var(--orange));color:#fff;font-size:13px;font-weight:600;padding-top:calc(6px + env(safe-area-inset-top))}
#vf .btn{background:rgb(255 255 255 / .18);color:#fff}
#vf .btn.dark{background:rgb(var(--blue))}
.vfwrap{position:relative;flex:1;min-height:0;overflow:hidden}
#vf .vfwrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#vfbox{position:absolute;left:6%;right:6%;top:30%;height:30%;border:2px solid #fff;border-radius:16px;box-shadow:0 0 0 9999px rgb(0 0 0 / .45);pointer-events:none}
.ocrl{display:flex;flex-wrap:wrap;gap:8px}
.ocrl .chip{min-height:36px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.ocrl .chip.to{background:none;box-shadow:inset 0 0 0 1px rgb(var(--sep) / .25);font-weight:600}
.ocrl .chip.to.on{background:rgb(var(--blue));box-shadow:none}

@media screen{
 th,td{border:0;border-bottom:1px solid rgb(var(--sep) / .2)}
 th{background:rgb(var(--card2));color:rgb(var(--label2));font-weight:600}
 td{background:rgb(var(--card))}
 tr.cl td{background:rgb(var(--card2));color:rgb(var(--label2))}
 .tbl{border-radius:var(--r);box-shadow:0 1px 2px rgb(0 0 0 / .04)}
 .sign .line{border-bottom-color:rgb(var(--label))}
}
@media print{
 body,#app{background:#fff;color:#111}
 .card{box-shadow:none;border:1.5px solid #111}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="netbar" hidden>Senza connessione: i dati potrebbero non essere aggiornati.</div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="gal" accept="image/*" hidden>
<div id="vf" hidden><div class="vfwrap"><video id="vfv" playsinline muted autoplay></video><div id="vfbox"></div></div><p>Metti lotto e scadenza dentro il riquadro, da vicino e senza riflessi</p><div class="vfbar"><button type="button" class="btn" data-a="vfClose">Annulla</button><button type="button" class="btn dark" data-a="vfSnap">Scatta</button></div></div>

<script>
'use strict';
/* ====== Dati: stanno sul server (database Cloudflare D1). Qui c'è solo una copia di lavoro. ====== */
const SKEY='scadenzario_session_v2';
const ADMIN_DEPT='Amministratore', ADMIN_NAME='Andrea Agamennone';
const EMPTY=()=>({rev:0,shop:{name:'',address:'',piva:''},urgentDays:1,soonDays:3,
  depts:{},staff:{},deptHasPw:{},durations:{},durPending:{},openings:[],arrivals:[]});
let db=EMPTY();
function loadSess(){try{return JSON.parse(localStorage.getItem(SKEY)||'null')}catch(e){return null}}
let sess=loadSess();
function saveSess(){try{if(sess)localStorage.setItem(SKEY,JSON.stringify(sess));else localStorage.removeItem(SKEY)}catch(e){}}
let deptsCache=[];
const newLogin=()=>({dept:'Gastronomia',depts:deptsCache,stage:1,ticket:'',ops:[],op:'',newName:''});

/* ====== Utilità ====== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const akey=n=>(n||'').trim().toLowerCase().replace(/\s+/g,' ');
const isAdmin=()=>!!(sess&&sess.admin);
function nowLocal(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
function todayDay(){return nowLocal().slice(0,10)}
function parseDay(s){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null}
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const eod=d=>{const x=new Date(d);x.setHours(23,59,59,999);return x};
function fD(s){const d=parseDay(s);return d?pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear():'—'}
function fDT(s){if(!s)return '—';const d=new Date(s);return isNaN(d)?'—':pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function fDay(d){return d?pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear():'—'}
function afterOpen(o){if(!o.aperto||!(+o.durata>0))return null;const d=new Date(o.aperto);if(isNaN(d))return null;d.setDate(d.getDate()+Number(o.durata));return eod(d)}
function deadline(o){const c=[];const s=parseDay(o.scad);if(s)c.push(eod(s));const a=afterOpen(o);if(a)c.push(a);return c.length?new Date(Math.min(...c)):null}
function status(o){
  if(o.stato==='chiuso')return{k:'closed',t:'CHIUSO'};
  const d=deadline(o);if(!d)return{k:'nodate',t:''};
  const left=Math.round((sod(d)-sod(new Date()))/864e5);
  if(left<0)return{k:'over',t:'SCADUTO',left};
  if(left<=db.urgentDays)return{k:'urg',t:'URGENTE',left};
  if(left<=db.soonDays)return{k:'soon',t:'IN SCADENZA',left};
  return{k:'ok',t:'',left};
}
const incomplete=o=>!o.articolo||!o.lotto||!o.scad||!o.aperto;
function missing(o){const m=[];if(!o.articolo)m.push('articolo');if(!o.lotto)m.push('lotto');if(!o.scad)m.push('scadenza');if(!o.aperto)m.push('apertura');return m}
function knownArticles(){const s=new Set();Object.keys(db.durations).forEach(k=>s.add(k));db.openings.forEach(o=>o.articolo&&s.add(akey(o.articolo)));db.arrivals.forEach(o=>o.articolo&&s.add(akey(o.articolo)));return [...s]}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* ====== Stato interfaccia ====== */
const ui={view:'loading',filter:'tutti',allDepts:false,msg:'',modal:null,form:null,sub:null,login:newLogin(),
  report:{from:'',to:'',dept:''},reportRows:[],reportLoading:false};
function setReportDefaults(){const t=new Date();const f=new Date();f.setDate(f.getDate()-7);const fm=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());ui.report.from=fm(f);ui.report.to=fm(t)}
setReportDefaults();

/* ====== Comunicazione con il server ====== */
let busy=false,pollT=null;
function setNet(ok){const n=$('#netbar');if(n)n.hidden=ok}
async function api(path,body,method){
  const h={'Content-Type':'application/json'};
  if(sess&&sess.token)h.Authorization='Bearer '+sess.token;
  let r;
  try{r=await fetch('/api'+path,{method:method||(body===undefined?'GET':'POST'),headers:h,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'})}
  catch(e){setNet(false);throw{offline:true,message:'Nessuna connessione: l\'operazione NON è stata salvata. Riprova quando torna la rete.'}}
  setNet(true);
  let j=null;try{j=await r.json()}catch(e){}
  if(r.status===401&&sess&&path.indexOf('/login')!==0){expireSession();throw{status:401,message:'Sessione scaduta: accedi di nuovo.'}}
  if(!r.ok)throw{status:r.status,message:(j&&j.error)||('Errore del server ('+r.status+')')};
  return j;
}
function expireSession(){
  sess=null;saveSess();db=EMPTY();ui.view='login';ui.sub=null;ui.form=null;ui.modal=null;
  ui.login=newLogin();ui.msg='Sessione scaduta: accedi di nuovo.';render();loadDepts();
}
async function loadDepts(){
  try{
    const r=await api('/depts');const changed=JSON.stringify(r.depts)!==JSON.stringify(deptsCache);
    deptsCache=r.depts;ui.login.depts=r.depts;
    if(ui.login.dept!==ADMIN_DEPT&&!r.depts.includes(ui.login.dept))ui.login.dept=r.depts[0]||ADMIN_DEPT;
    if(changed&&ui.view==='login'&&ui.login.stage===1)render();
  }catch(e){ui.msg=e.message;if(ui.view==='login')render()}
}
async function refresh(){
  const s=await api('/state');
  db=Object.assign(EMPTY(),s);
  db.staff=s.staff||{};db.deptHasPw=s.deptHasPw||{};
  db.depts={};(s.depts||[]).forEach(d=>{db.depts[d]=(db.staff[d]||[]).map(o=>o.name)});
  deptsCache=s.depts||deptsCache;
}
/* Una sola operazione alla volta: evita doppi salvataggi se si tocca due volte. */
async function busyRun(fn){
  if(busy)return false;
  busy=true;document.body.classList.add('busy');
  let ok=false;

/* ====== Lettura etichetta ====== */
const MESI={GEN:1,JAN:1,FEB:2,MAR:3,APR:4,MAG:5,MAY:5,GIU:6,JUN:6,LUG:7,JUL:7,AGO:8,AUG:8,SET:9,SEP:9,OTT:10,OCT:10,NOV:11,DIC:12,DEC:12};
const KW_SCAD=/scad|entro|consum|t\.?m\.?c|best|\bbb\b|\bbbe\b|exp|use by|prefer|da cons/i;
const KW_PROD=/prod|confez|packed|lavoraz|imball|\bpkd\b/i;
/* L'OCR confonde spesso lettere e cifre (O→0, I/l→1, S→5, B→8): si corregge solo dentro i gruppi che sembrano date */
function digitsFix(s){return s.replace(/[OoQD]/g,'0').replace(/[Il|!]/g,'1').replace(/[Ss]/g,'5').replace(/B/g,'8').replace(/Z/g,'2')}
function labelDates(t){
  const out=[];
  const add=(i,d,mo,y,monthOnly)=>{
    if(y<100)y+=2000;if(!(mo>=1&&mo<=12&&d>=1&&d<=31&&y>=2020&&y<=2100))return;
    const before=t.slice(Math.max(0,i-40),i);const near=before.slice(-22);
    const scad=KW_SCAD.test(before),prod=KW_PROD.test(near)&&!KW_SCAD.test(near);
    if(monthOnly&&!scad)return;
    out.push({iso:y+'-'+pad(mo)+'-'+pad(d),scad,prod});
  };
  const N='[0-9OoIl|SB]';let m;
  const re1=new RegExp('(?<![0-9])('+N+'{1,2}) ?[\\/\\.\\-,] ?('+N+'{1,2}) ?[\\/\\.\\-,] ?('+N+'{4}|'+N+'{2})(?![0-9])','g');
  while((m=re1.exec(t)))add(m.index,+digitsFix(m[1]),+digitsFix(m[2]),+digitsFix(m[3]));
  const re2=/(?<!\d)(\d{1,2})\s*[\/\.\-]?\s*(GEN|FEB|MAR|APR|MAG|GIU|LUG|AGO|SET|OTT|NOV|DIC|JAN|MAY|JUN|JUL|AUG|SEP|OCT|DEC)[A-Z]*\.?\s*[\/\.\-]?\s*(\d{4}|\d{2})(?!\d)/gi;
  while((m=re2.exec(t)))add(m.index,+m[1],MESI[m[2].toUpperCase()],+m[3]);
  // "entro fine 11/2026": ultimo giorno del mese, solo se c'è una parola di scadenza vicino
  const re3=/(?<![\d\/\.\-])(\d{1,2}) ?[\/\.\-] ?(20\d{2})(?![\d\/\.\-])/g;
  while((m=re3.exec(t))){const mo=+m[1],y=+m[2];if(mo>=1&&mo<=12)add(m.index,new Date(y,mo,0).getDate(),mo,y,true)}
  // date senza separatori subito dopo "scad"/"entro": 12112026 o 121126
  const re4=/(?:scad\w*|entro(?: il)?|exp\w*|tmc)\W{0,6}(\d{2})(\d{2})(\d{4}|\d{2})(?!\d)/gi;
  while((m=re4.exec(t)))add(m.index+m[0].length-m[1].length-m[2].length-m[3].length,+m[1],+m[2],+m[3]);
  return out;
}
function labelLot(t){
  const ok=v=>v&&/\d/.test(v)&&v.length>=3&&v.length<=24;
  const clean=v=>String(v||'').toUpperCase().replace(/[.\-\/:,;]+$/,'');
  let m=/\b(?:lotto|l[o0]tt[o0]|lot|lote|batch|partita)\b\.?\s*(?:n[r°o]?\.?|°|#)?\s*[:.\-]?\s*([A-Z0-9][A-Z0-9\-\/\.]*(?: [0-9][A-Z0-9\-\/]*)?)/i.exec(t);
  if(m&&ok(clean(m[1])))return clean(m[1]).replace(/ /g,'');
  m=/(?:^|[\s(])L\s*[:.\-]?\s*([0-9][A-Z0-9\-\/]{2,})/m.exec(t);
  if(m&&ok(clean(m[1])))return clean(m[1]);
  return '';
}
function labelLines(t){
  const seen=new Set();
  return String(t||'').split('\n').map(s=>s.replace(/[^\p{L}\p{N} .,'%\/\-&]/gu,' ').replace(/\s+/g,' ').trim())
    .filter(s=>s.length>=3&&s.length<=48&&/\p{L}{3}/u.test(s)&&!seen.has(s.toLowerCase())&&seen.add(s.toLowerCase())).slice(0,12);
}
function parseLabel(text){
  const out={};const t=String(text||'').replace(/\r/g,'');
  const dates=labelDates(t);
  const best=dates.find(x=>x.scad)||dates.filter(x=>!x.prod).sort((a,b)=>a.iso<b.iso?1:-1)[0];
  if(best)out.scad=best.iso;
  const lot=labelLot(t);if(lot)out.lotto=lot;
  const low=t.toLowerCase().replace(/\s+/g,' ');let art='';
  knownArticles().forEach(a=>{if(a.length>art.length&&low.includes(a))art=a});
  if(art)out.articolo=db.openings.concat(db.arrivals).map(o=>o.articolo).find(n=>akey(n)===art)||art;
  return out;
}
let tessLoading=null,tessWorker=null;

/* Un solo "lettore" riusato per tutte le foto: la lingua si scarica una volta sola */

function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>rej(new Error('img'));i.src=u})}
/* Ridimensiona (anche ingrandendo fino a 2x: l'OCR legge male il testo piccolo) */
function scaled(img,max,up){const w=img.width,h=img.height;const r=Math.min(up?2:1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*r));c.height=Math.max(1,Math.round(h*r));const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,0,0,c.width,c.height);return c}
/* Grigi con contrasto automatico; con bin=true bianco/nero puro (soglia di Otsu) */
function enhance(src,bin){
  const c=document.createElement('canvas');c.width=src.width;c.height=src.height;const x=c.getContext('2d');x.drawImage(src,0,0);
  const id=x.getImageData(0,0,c.width,c.height);const p=id.data;const n=p.length/4;const hist=new Array(256).fill(0);const g=new Uint8ClampedArray(n);
  for(let i=0;i<n;i++){const v=Math.round(0.3*p[i*4]+0.59*p[i*4+1]+0.11*p[i*4+2]);g[i]=v;hist[v]++}
  let lo=0,hi=255,acc=0;for(;lo<255&&(acc+=hist[lo])<n*0.02;lo++);acc=0;for(;hi>0&&(acc+=hist[hi])<n*0.02;hi--);
  const span=Math.max(1,hi-lo);let th=128;
  if(bin){const h2=new Array(256).fill(0);for(let i=0;i<n;i++)h2[Math.max(0,Math.min(255,Math.round((g[i]-lo)*255/span)))]++;
    let sum=0;for(let i=0;i<256;i++)sum+=i*h2[i];let sB=0,wB=0,best=0;
    for(let i=0;i<256;i++){wB+=h2[i];if(!wB)continue;const wF=n-wB;if(!wF)break;sB+=i*h2[i];const mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)*(mB-mF);if(v>best){best=v;th=i}}}
  for(let i=0;i<n;i++){let v=(g[i]-lo)*255/span;v=v<0?0:v>255?255:v;if(bin)v=v>th?255:0;p[i*4]=p[i*4+1]=p[i*4+2]=v}

}
/* Mirino interno: impone la camera posteriore (l'attributo capture è solo un suggerimento e alcuni telefoni lo ignorano) */
let vfStream=null;
async function openCamera(){
  const md=navigator.mediaDevices;
  if(!md||!md.getUserMedia){$('#cam').click();return}
  const base={width:{ideal:1920},height:{ideal:1080}};
  try{vfStream=await md.getUserMedia({audio:false,video:Object.assign({facingMode:{exact:'environment'}},base)})}
  catch(e){
    try{vfStream=await md.getUserMedia({audio:false,video:Object.assign({facingMode:{ideal:'environment'}},base)})}
    catch(e2){if(ui.form){ui.form.ocr='Fotocamera non disponibile: consenti l\'accesso alla fotocamera nelle impostazioni del browser, oppure usa "Galleria".';render()}return}
  }
  // messa a fuoco continua, dove il telefono la supporta
  try{await vfStream.getVideoTracks()[0].applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
  const v=$('#vfv');v.srcObject=vfStream;$('#vf').hidden=false;
  try{await v.play()}catch(e){}
}
function closeCamera(){
  if(vfStream){vfStream.getTracks().forEach(t=>t.stop());vfStream=null}
  const v=$('#vfv');if(v)v.srcObject=null;const o=$('#vf');if(o)o.hidden=true;
}
function snapCamera(){
  const v=$('#vfv');if(!vfStream||!v.videoWidth)return;
  // ritaglia solo il riquadro bianco del mirino (il video è mostrato "a riempimento")
  const vw=v.videoWidth,vh=v.videoHeight,W=v.clientWidth,H=v.clientHeight;
  const s=Math.max(W/vw,H/vh),ox=(W-vw*s)/2,oy=(H-vh*s)/2;
  const vr=v.getBoundingClientRect(),br=$('#vfbox').getBoundingClientRect();
  let sx=(br.left-vr.left-ox)/s,sy=(br.top-vr.top-oy)/s,sw=br.width/s,sh=br.height/s;
  sx=Math.max(0,sx);sy=Math.max(0,sy);sw=Math.min(vw-sx,sw);sh=Math.min(vh-sy,sh);
  const c=document.createElement('canvas');c.width=Math.round(sw);c.height=Math.round(sh);
  c.getContext('2d').drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);closeCamera();
  c.toBlob(b=>handlePhoto(b),'image/jpeg',0.92);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)closeCamera()});
async function handlePhoto(file){
  if(!file||!ui.form)return;
  const f=ui.form;f.ocr='Lettura della foto in corso… (la prima volta può richiedere qualche secondo)';f.ocrLines=[];render();
  try{
    const img=await loadImg(file);
    f.foto=scaled(img,700).toDataURL('image/jpeg',0.6);f.fotoNew=true;render();
    const base=scaled(img,2000,true);
    let text=await ocrRead(enhance(base,false),'11');
    let p=parseLabel(text);
    if(!p.scad||!p.lotto){   // seconda lettura in bianco/nero se manca qualcosa
      if(ui.form!==f)return;
      f.ocr='Ancora un momento…';render();
      text+='\n'+await ocrRead(enhance(base,true),'6');
      p=parseLabel(text);
    }
    if(ui.form!==f)return;
    f.auto=f.auto||{};let n=0;const miss=[];
    // si riempiono solo i campi vuoti o già compilati dalla foto: quello scritto a mano non si tocca
    [['articolo','articolo'],['lotto','lotto'],['scad','scadenza']].forEach(([k,lab])=>{
      if(p[k]&&(!f[k]||f.auto[k])){f[k]=p[k];f.auto[k]=true;n++}else if(!p[k]&&!f[k])miss.push(lab)});
    if(f.auto.articolo&&f.kind==='open')applyDuration(f);
    f.ocrLines=labelLines(text);if(!f.ocrTo)f.ocrTo='articolo';
    f.ocr=(n?'Letti '+n+' campi dalla foto: controlla quelli evidenziati.':'Non sono riuscito a riconoscere i dati.')+
      (miss.length?' Mancano: '+miss.join(', ')+'.':'')+(f.ocrLines.length?' Puoi toccare le righe lette qui sotto per copiarle (più righe di seguito si uniscono).':' Compila a mano.');
  }catch(e){
    f.ocr=(e&&e.message==='offline')?'Lettura automatica non disponibile (connessione assente): compila a mano.':'Lettura non riuscita: compila a mano.';
  }
  render();
}

    <label class="chk"><input type="checkbox" data-a-change="close" data-id="${o.id}"> Segna come chiuso</label>
    <button type="button" class="btn sm" data-a="edit" data-id="${o.id}">${inc?'Completa':'Modifica'}</button>
   </div></div>`;
}
function vList(){
  const all=isAdmin()||ui.allDepts;
  let items=db.openings.filter(o=>all||o.dept===sess.dept);
  const open=items.filter(o=>o.stato==='aperto');
  const urgent=open.filter(o=>['urg','over'].includes(status(o).k));
  const soon=open.filter(o=>status(o).k==='soon');
  const incs=open.filter(incomplete);
  const dayAgo=new Date(Date.now()-864e5);
  const closed=items.filter(o=>o.stato==='chiuso').sort((a,b)=>(b.chiusoIl||'')<(a.chiusoIl||'')?-1:1);
  const rank=o=>{const d=deadline(o);return d?d.getTime():9e15};
  const by=a=>a.slice().sort((x,y)=>rank(x)-rank(y));
  let body='';
  const F=ui.filter;
  if(F==='chiusi'){
    body=closed.length?closed.slice(0,60).map(card).join(''):'<p class="hint">Nessuna apertura chiusa.</p>';
  }else if(F==='urgenti'){
    body=urgent.length?by(urgent).map(card).join(''):'<p class="hint">Nessun prodotto urgente.</p>';
  }else{
    const toc=by(incs);const ok=by(open.filter(o=>!incomplete(o)));
    const recent=closed.filter(o=>o.chiusoIl&&new Date(o.chiusoIl)>=dayAgo);
    const np=Object.keys(db.durPending).filter(x=>db.durations[x]!=null).length;
    body=(isAdmin()&&np?`<button type="button" class="card dash" style="text-align:left;font:inherit;cursor:pointer" data-a="toDurations"><strong style="font-size:14px">${np} durat${np===1?'a':'e'} da validare ›</strong><span class="s">Imparate da un operatore: controllale nelle impostazioni.</span></button>`:'')+(toc.length?`<div class="sec">DA COMPLETARE (${toc.length})</div>${toc.map(card).join('')}`:'')+
      `<div class="sec">APERTI (${ok.length})</div>${ok.length?ok.map(card).join(''):'<p class="hint">Nessun prodotto aperto.</p>'}`+
      (recent.length?`<div class="sec">CHIUSI NELLE ULTIME 24 ORE (${recent.length})</div>${recent.map(card).join('')}`:'');
  }
  return topbar('Scadenzario',who(),'<button type="button" class="btn sm" data-a="logout">Esci</button>')+
  `<main>${msgBox()}
   <div class="card grey"><strong style="font-size:14px">Avvisi</strong><span style="font-size:14px">${urgent.length} urgenti · ${soon.length} in scadenza · ${incs.length} da completare</span></div>
   <div class="row" style="flex-wrap:wrap">${[['tutti','Tutti'],['urgenti','Urgenti'],['chiusi','Chiusi']].map(x=>`<button type="button" class="chip ${F===x[0]?'on':''}" data-a="filter" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
   ${isAdmin()?'':`<label class="chk"><input type="checkbox" data-a-change="allDepts" ${ui.allDepts?'checked':''}> Mostra anche gli altri reparti</label>`}
   ${body}
   <button type="button" class="btn dark full" style="min-height:52px" data-a="new">+ Nuova apertura</button></main>`+tabs('list');
}

  <div class="col w130"><button type="button" class="btn dark" style="min-height:52px" data-a="cam">Scatta foto</button><button type="button" class="btn" style="min-height:52px" data-a="gal">Galleria</button></div></div>

function inp(label,id,key,type,extra){
  const f=ui.form;const auto=f.auto&&f.auto[key];
  return `<div class="f"><label for="${id}">${label}</label><input id="${id}" type="${type}" data-f="${key}" value="${esc(f[key]??'')}" class="${auto?'auto':''}" ${extra||''}>${auto?'<span class="warn">Letto dalla foto: controlla</span>':''}</div>`;
}
function derived(){
  const f=ui.form;
  const dl=deadline({scad:f.scad,aperto:f.aperto,durata:f.durata===''?0:Number(f.durata)});
  const d=dupsOf(f);
  const k=akey(f.articolo);
  return {
    dl:f.kind==='open'?`<span style="font-size:13px;color:var(--ink2)">Scade (il primo tra scadenza confezione e durata dopo apertura)</span><strong style="font-size:18px">${dl?fDay(dl):'—'}</strong>`:'',
    dup:d.map(o=>`<div class="card"><strong style="font-size:14px">C'è già ${esc(o.articolo)} aperto${o.lotto?' (lotto '+esc(o.lotto)+')':''}</strong><span class="s">Salvando, quello passa in chiusura come "sostituito da nuova apertura".</span></div>`).join(''),
    dur:k&&db.durations[k]!=null&&db.durPending[k]?(isAdmin()?'Durata '+db.durations[k]+' gg, DA VALIDARE: se è giusta salvando la validi, altrimenti correggila':'Durata '+db.durations[k]+' gg, in attesa di validazione dell\'amministratore'):k&&db.durations[k]!=null?(isAdmin()?'Durata conosciuta: '+db.durations[k]+' gg (puoi cambiarla come admin)':'Articolo già noto: durata '+db.durations[k]+' gg, modificabile solo dall\'amministratore'):(k?'Articolo nuovo: la durata che inserisci verrà ricordata':''),
    locked:durLocked(f)
  };
}

function reportRows(){
  const r=ui.report;const from=r.from?sod(parseDay(r.from)):null;const to=r.to?eod(parseDay(r.to)):null;
  return (ui.reportRows||[]).filter(o=>{
    if(r.dept&&o.dept!==r.dept)return false;
    if(!(isAdmin()||ui.allDepts||o.dept===sess.dept))return false;
    const a=o.aperto?new Date(o.aperto):null;const c=o.chiusoIl?new Date(o.chiusoIl):null;
    if(to&&a&&a>to)return false;
    if(from&&o.stato==='chiuso'&&c&&c<from)return false;
    return true;
  }).sort((a,b)=>(b.aperto||'')<(a.aperto||'')?-1:1);
}

function render(){
  let h='';
  if(ui.view==='loading')h='<main style="justify-content:center"><p class="hint" style="text-align:center">Caricamento…</p></main>';
  else if(ui.view==='offline')h=`<main style="justify-content:center;gap:16px"><h1 style="margin:0;font-size:28px">Scadenzario</h1>${msgBox()}<button type="button" class="btn dark full" data-a="retry">Riprova</button><button type="button" class="btn full" data-a="logout">Esci</button></main>`;
  else if(!sess||ui.view==='login')h=vLogin();
  else if(ui.view==='new'||ui.view==='newArrival')h=vForm();
  else if(ui.view==='arrivals')h=vArrivals();
  else if(ui.view==='report')h=vReport();
  else if(ui.view==='settings'){h=ui.sub==='durations'?vDurations():ui.sub==='staff'?vStaff():vSettings()}
  else h=vList();
  $('#app').innerHTML=h+vModal();
  if(ui.view==='new'||ui.view==='newArrival')refreshForm();
}

/* ====== Azioni ====== */
function go(v){ui.view=v;ui.sub=null;ui.form=null;render();window.scrollTo(0,0);if(v==='report')loadReport();if(v==='settings')pushStatus()}
/* ====== Notifiche sul telefono ====== */
const PUSH_OK='serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
ui.push={state:PUSH_OK?(Notification.permission==='denied'?'denied':'unknown'):'unsupported',depts:[],sel:[]};
const urlB64=s=>{const b=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function pushSub(){const reg=await navigator.serviceWorker.getRegistration('/');return reg?await reg.pushManager.getSubscription():null}
async function pushStatus(){
  if(!PUSH_OK||!sess)return;
  try{
    if(Notification.permission==='denied'){ui.push.state='denied'}
    else{const sub=await pushSub();
      if(!sub)ui.push.state='off';
      else{const r=await api('/push/status',{endpoint:sub.endpoint});ui.push.state=r.subscribed?'on':'off';ui.push.depts=r.depts}}
  }catch(e){ui.push.state='off'}
  if(ui.view==='settings'&&!ui.sub)render();
}
function vPush(){
  const p=ui.push;let b;
  if(p.state==='unsupported')b='<p class="hint">Questo browser non supporta le notifiche. Su iPhone installa prima l\'app dalla schermata Home (serve iOS 16.4 o successivo).</p>';
  else if(p.state==='denied')b='<p class="hint">Le notifiche sono bloccate per questo sito: riattivale dalle impostazioni del telefono.</p>';
  else if(p.state==='unknown')b='<p class="hint">Controllo…</p>';
  else if(p.state==='on')b=`<p class="hint">Attive su questo telefono per: <strong>${esc(p.depts.join(', '))}</strong>. Ogni mattina alle 7:30 ricevi il riepilogo di prodotti scaduti, urgenti e in scadenza (solo se ce ne sono). Se esci dall'app le notifiche si disattivano.</p>
   <div class="row"><button type="button" class="btn sm grow" data-a="pushTest">Invia notifica di prova</button><button type="button" class="btn sm grow" data-a="pushOff">Disattiva</button></div>`;
  else b=(isAdmin()?`<p class="hint">Scegli di quali reparti ricevere l'avviso su questo telefono:</p>${Object.keys(db.depts).map(d=>`<label class="chk"><input type="checkbox" data-a-change="pushDept" data-d="${esc(d)}" ${p.sel.includes(d)?'checked':''}> ${esc(d)}</label>`).join('')}`:`<p class="hint">Riceverai l'avviso del tuo reparto (${esc(sess.dept)}).</p>`)+'<button type="button" class="btn dark sm" data-a="pushOn">Attiva le notifiche</button>';
  return `<div class="card"><strong>Notifiche sul telefono</strong>${b}</div>`;
}
const A={
  go:t=>go(t.dataset.v),
  filter:t=>{ui.filter=t.dataset.v;render()},
  sub:t=>{ui.sub=t.dataset.v||null;render()},
  loginNext:()=>runR(async()=>{
    const l=ui.login;const pwd=($('#l-pwd')||{}).value||'';
    if(!pwd)throw{message:'Inserisci la password.'};
    if(l.dept===ADMIN_DEPT){await finishLogin(await api('/login/admin',{password:pwd}));return}
    const r=await api('/login/dept',{dept:l.dept,password:pwd});
    l.ticket=r.ticket;l.ops=r.operators;l.op=r.operators.length?r.operators[0].id:'__new__';l.newName='';l.stage=2;
  }),
  loginGo:()=>runR(async()=>{
    const l=ui.login;const isNew=l.op==='__new__'||!l.ops.length;
    const body={ticket:l.ticket,pin:($('#l-pin')||{}).value||'',pin2:($('#l-pin2')||{}).value||'',opId:isNew?'__new__':l.op};
    if(isNew){body.newName=(l.newName||'').trim();if(!body.newName)throw{message:'Scrivi il tuo nome.'}}
    try{await finishLogin(await api('/login/operator',body))}
    catch(e){if(e&&/^Tempo scaduto/.test(e.message||''))l.stage=1;throw e}
  }),
  loginBack:()=>{ui.login.stage=1;ui.login.ticket='';ui.msg='';render()},
  retry:()=>boot(),
  logout:()=>runR(async()=>{
    try{const sb=PUSH_OK&&await pushSub();if(sb){await api('/push/unsubscribe',{endpoint:sb.endpoint});await sb.unsubscribe()}}catch(e){}
    const tok=sess&&sess.token;sess=null;saveSess();
    try{await fetch('/api/logout',{method:'POST',headers:{Authorization:'Bearer '+tok}})}catch(e){}
    db=EMPTY();ui.view='login';ui.sub=null;ui.form=null;ui.login=newLogin();loadDepts();
  }),
  new:()=>{ui.form=newForm('open');ui.view='new';render();window.scrollTo(0,0)},
  newArrival:()=>{ui.form=newForm('arrival');ui.view='newArrival';render();window.scrollTo(0,0)},
  edit:t=>{const o=db.openings.find(x=>x.id==t.dataset.id);if(!o)return;
    ui.form=Object.assign(newForm('open'),o,{durata:o.durata===''||o.durata==null?'':String(o.durata),foto:'',fotoNew:false,auto:{}});
    ui.view='new';render();window.scrollTo(0,0);
    if(o.hasFoto){const id=o.id;api('/photos/'+encodeURIComponent(id)).then(r=>{
      if(r.data&&ui.form&&ui.form.id===id&&!ui.form.fotoNew){ui.form.foto=r.data;const ph=document.querySelector('.photo');if(ph)ph.innerHTML='<img src="'+r.data+'" alt="Foto dell\'etichetta">'}
    }).catch(()=>{})}},
  editArrival:t=>{const o=db.arrivals.find(x=>x.id==t.dataset.id);if(!o)return;ui.form=Object.assign(newForm('arrival'),o,{auto:{}});ui.view='newArrival';render()},
  openFromArrival:t=>{const a=db.arrivals.find(x=>x.id==t.dataset.id);if(!a)return;
    ui.form=newForm('open',{articolo:a.articolo,lotto:a.lotto,scad:a.scad,dept:a.dept,fromArrival:a.id});applyDuration(ui.form);ui.view='new';render();window.scrollTo(0,0)},
  removeArrival:t=>{ui.modal={title:'Rimuovere dagli arrivi?',text:'L\'articolo esce dalla giacenza (es. scartato o finito).',yes:'Rimuovi',fn:()=>act(()=>api('/arrivals/'+encodeURIComponent(t.dataset.id)+'/remove',{}),'Arrivo rimosso.')};render()},
  cancelForm:()=>{ui.form=null;go(ui.view==='newArrival'?'arrivals':'list')},
  saveForm:()=>{
    const f=ui.form;if(!f)return;
    const d=dupsOf(f);
    if(d.length&&f.kind==='open'){ui.modal={title:'Prodotto già aperto',text:'C\'è già "'+d[0].articolo+'" aperto. Salvando, quello passa in chiusura come "sostituito da nuova apertura". Continuare?',yes:'Salva e chiudi il vecchio',fn:saveForm};render();return}
    saveForm();
  },
  cam:()=>openCamera(),
  vfClose:()=>closeCamera(),
  vfSnap:()=>snapCamera(),
  gal:()=>$('#gal').click(),
  ocrTo:t=>{if(ui.form){ui.form.ocrTo=t.dataset.v;ui.form.ocrSet=null;render()}},
  // toccando più righe di seguito si uniscono (l'OCR a volte spezza un nome su due righe)
  ocrLine:t=>{const f=ui.form;if(!f||!f.ocrLines)return;const k=f.ocrTo||'articolo';const l=f.ocrLines[+t.dataset.i]||'';
    const v=k==='lotto'?l.toUpperCase().replace(/\s+/g,''):l;f[k]=f.ocrSet===k&&f[k]?f[k]+(k==='lotto'?'':' ')+v:v;f.ocrSet=k;if(f.auto)delete f.auto[k];if(k==='articolo')applyDuration(f);render()},
  modalNo:()=>{ui.modal=null;render()},
  modalYes:()=>{const m=ui.modal;ui.modal=null;if(m&&m.fn)m.fn();render()},
  print:()=>window.print(),
  pushOn:()=>runR(async()=>{
    const p=ui.push,depts=isAdmin()?p.sel.slice():[sess.dept];
    if(!depts.length)throw{message:'Scegli almeno un reparto.'};
    if(await Notification.requestPermission()!=='granted'){p.state=Notification.permission==='denied'?'denied':'off';throw{message:'Permesso per le notifiche non concesso.'}}
    const reg=await navigator.serviceWorker.register('/sw.js');await navigator.serviceWorker.ready;
    const k=await api('/push/key');
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64(k.key)});
    const j=sub.toJSON();
    const r=await api('/push/subscribe',{endpoint:j.endpoint,keys:j.keys,depts});
    p.state='on';p.depts=r.depts;ui.msg='Notifiche attivate.';
  }),
  pushOff:()=>runR(async()=>{
    const sub=await pushSub();
    if(sub){try{await api('/push/unsubscribe',{endpoint:sub.endpoint})}catch(e){}await sub.unsubscribe()}
    ui.push.state='off';ui.push.depts=[];ui.msg='Notifiche disattivate.';
  }),
  pushTest:()=>runR(async()=>{
    const sub=await pushSub();if(!sub)throw{message:'Notifiche non attive su questo telefono.'};
    const r=await api('/push/test',{endpoint:sub.endpoint});
    ui.msg=r.status>=200&&r.status<300?'Notifica inviata: dovrebbe comparire entro pochi secondi.':'Il servizio notifiche ha risposto con errore ('+(r.status||'nessuna risposta')+').';
  }),
  saveShop:()=>saveSettings('Dati del negozio salvati.'),
  exportJson:()=>runR(async()=>{const j=await api('/admin/export');download('scadenzario-backup-'+todayDay()+'.json',JSON.stringify(j,null,1),'application/json')}),
  exportCsv:()=>runR(async()=>{
    const j=await api('/openings?all=1');
    const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
    const rows=[['Reparto','Articolo','Lotto','Scadenza confezione','Aperto il','Durata gg','Scadenza dopo apertura','Operatore apertura','Stato','Chiuso il','Motivo','Operatore chiusura']];
    j.openings.forEach(o=>rows.push([o.dept,o.articolo,o.lotto,o.scad,o.aperto,o.durata,afterOpen(o)?fDay(afterOpen(o)):'',o.opAperto,o.stato,o.chiusoIl||'',o.motivo||'',o.opChiuso||'']));
    download('registro-aperture-'+todayDay()+'.csv','﻿'+rows.map(r=>r.map(q).join(';')).join('\n'),'text/csv');
  }),
  delDur:t=>act(()=>api('/admin/durations/delete',{k:t.dataset.k}),'Durata eliminata.'),
  valDur:t=>act(()=>api('/admin/durations/validate',{k:t.dataset.k}),'Durata validata: '+t.dataset.k+'.'),
  toDurations:()=>{ui.view='settings';ui.sub='durations';ui.form=null;render();window.scrollTo(0,0)},
  addDur:()=>{const n=akey($('#d-new-n').value);const d=Number($('#d-new-d').value);if(!n||!(d>0)){ui.msg='Inserisci articolo e giorni.';render();return}act(()=>api('/admin/durations',{k:n,days:d}),'Articolo aggiunto.')},
  addOp:t=>{const d=t.dataset.d;const v=$('#o-'+CSS.escape(d)).value.trim();if(!v)return;act(()=>api('/admin/operator',{dept:d,name:v}),'Operatore aggiunto.')},
  delOp:t=>{ui.modal={title:'Rimuovere l\'operatore?',text:t.dataset.n+' non comparirà più nell\'elenco del login e verrà scollegato. Le sue aperture restano nel registro.',yes:'Rimuovi',fn:()=>act(()=>api('/admin/operator/delete',{id:t.dataset.id}),'Operatore rimosso.')};render()},
  resetPin:t=>{ui.modal={title:'Azzerare il PIN?',text:t.dataset.n+' verrà scollegato e dovrà scegliere un nuovo PIN al prossimo accesso.',yes:'Azzera PIN',fn:()=>act(()=>api('/admin/operator/reset-pin',{id:t.dataset.id}),'PIN di '+t.dataset.n+' azzerato.')};render()},
  setDeptPw:t=>{const d=t.dataset.d;const v=$('#pw-'+CSS.escape(d)).value;if(v.length<6){ui.msg='La password deve avere almeno 6 caratteri.';render();return}act(()=>api('/admin/dept/password',{name:d,password:v}),'Password del reparto '+d+' salvata.')},
  addDept:()=>{const v=$('#o-newdept').value.trim();const pw=$('#o-newdept-pw').value;if(!v){ui.msg='Scrivi il nome del reparto.';render();return}if(pw.length<6){ui.msg='La password deve avere almeno 6 caratteri.';render();return}act(()=>api('/admin/dept',{name:v,password:pw}),'Reparto aggiunto.')}
};
const AC={
  loginDept:t=>{ui.login.dept=t.value;ui.login.op='';render()},
  loginOp:t=>{ui.login.op=t.value;render()},
  close:t=>{const o=db.openings.find(x=>x.id==t.dataset.id);if(!o||!t.checked)return;
    ui.modal={title:'Chiudere il prodotto?',text:'"'+(o.articolo||'prodotto')+'"'+(o.lotto?' (lotto '+o.lotto+')':'')+' passa in chiusura come "terminato al banco". Dopo la conferma non si può più riaprire.',yes:'Sì, chiudi',
      fn:()=>act(()=>api('/openings/'+encodeURIComponent(o.id)+'/close',{}),'Chiuso: '+(o.articolo||'prodotto')+'.')};render()},
  allDepts:t=>{ui.allDepts=t.checked;render()},
  pushDept:t=>{const s=ui.push.sel,d=t.dataset.d,i=s.indexOf(d);if(t.checked&&i<0)s.push(d);else if(!t.checked&&i>=0)s.splice(i,1)}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t||t.disabled)return;
  const f=A[t.dataset.a];if(f)f(t,e);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='cam'||t.id==='gal'){const file=t.files&&t.files[0];t.value='';handlePhoto(file);return}
  const c=t.dataset&&t.dataset.aChange;if(c&&AC[c]){AC[c](t);return}
  if(t.dataset.f&&ui.form){
    const k=t.dataset.f;ui.form[k]=t.value;if(ui.form.auto)delete ui.form.auto[k];
    if(k==='articolo'){applyDuration(ui.form)}
    if(k==='dept'){/* ricalcola duplicati */}
    refreshForm();
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f&&ui.form){ui.form[t.dataset.f]=t.value;ui.form.ocrSet=null;if(ui.form.auto)delete ui.form.auto[t.dataset.f];if(t.dataset.f!=='articolo')refreshForm()}
  else if(t.dataset.aInput==='loginNew')ui.login.newName=t.value;
  else if(t.dataset.r){ui.report[t.dataset.r]=t.value;if(t.tagName==='SELECT')render()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.r){ui.report[t.dataset.r]=t.value;if(t.dataset.r==='dept')render();else loadReport()}
  else if(t.dataset.s){saveSettings('Avvisi salvati.')}
  else if(t.dataset.dur){const v=Number(t.value);if(v>0)act(()=>api('/admin/durations',{k:t.dataset.dur,days:v}),'Durata aggiornata.')}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='l-pwd')A.loginNext();
  else if(e.target.id==='l-pin'||e.target.id==='l-pin2')A.loginGo();
});
async function boot(){
  if(sess){
    ui.view='loading';ui.msg='';render();
    try{await refresh();ui.view='list';startPoll()}
    catch(e){if(sess){ui.view='offline';ui.msg=(e&&e.message)||'Impossibile caricare i dati.'}}
    render();
  }else{ui.view='login';render();loadDepts()}
}
boot();
</script>
